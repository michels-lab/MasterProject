name: FS-C08 actual OpenFOAM Foundation14 CFD solver library build

on:
  push:
    branches:
      - research/fs-c08-conservative-phase-mass-20261123
    paths:
      - 'freesurface/FS-C08_conservative_phase_mass/coupled_solver/native/**'
      - 'analysis_tools/stage_fs_c08_coupled.py'
      - 'analysis_tools/run_fs_c08_real_cfd.py'
      - 'analysis_tools/test_run_fs_c08_real_cfd.py'
      - '.github/workflows/fs-c08-native-cfd-build.yml'
  pull_request:
    paths:
      - 'freesurface/FS-C08_conservative_phase_mass/coupled_solver/native/**'
      - 'analysis_tools/stage_fs_c08_coupled.py'
      - 'analysis_tools/run_fs_c08_real_cfd.py'
      - 'analysis_tools/test_run_fs_c08_real_cfd.py'
      - '.github/workflows/fs-c08-native-cfd-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  compile-native-fs-c08-solver:
    name: wmake libso Foundation14 — actual coupled fluid solver, NO synthetic CFD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: fs-c08-foundation14-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout MasterProject research code
        uses: actions/checkout@v4

      - name: Validate real-CFD numerical-budget evidence gate (NO CFD run)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s analysis_tools -p 'test_run_fs_c08_real_cfd.py' -v

      # Public setup-openfoam action supports the Foundation org version 14
      # on ubuntu-24.04. It installs the actual headers and shared libraries,
      # unlike a standalone C++17 proof.
      - name: Install and activate actual OpenFOAM Foundation14
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: '14'
          cache: true

      - name: Compile ACTUAL native FS-C08 CFD solver with OpenFOAM14 wmake
        id: native-build
        shell: bash
        run: |
          # setup-openfoam already exported the active Foundation14
          # environment. Re-sourcing bashrc under nounset fails on
          # unbound ZSH_NAME *before wmake starts*. Do not source again.
          set -euo pipefail
          test "${WM_PROJECT_VERSION:-}" = '14'
          command -v wmake
          test -n "${FOAM_MODULES:-}"
          echo "WM_PROJECT_VERSION=${WM_PROJECT_VERSION}"
          echo "FOAM_MODULES=${FOAM_MODULES}"
          cd freesurface/FS-C08_conservative_phase_mass/coupled_solver/native
          wmake libso 2>&1 | tee "${RUNNER_TEMP}/fs-c08-native-wmake.log"
          test -f "${FOAM_USER_LIBBIN}/libfsC08ConservativeVoF.so"
          echo 'FS_C08_REAL_OPENFOAM14_SOLVER_LIBRARY_WMAKE_PASS__NO_CFD_RUN'

      - name: Resolve and load FS-C08 user library against native Foundation14
        id: native-runtime-load
        shell: bash
        run: |
          set -euo pipefail
          lib="${FOAM_USER_LIBBIN}/libfsC08ConservativeVoF.so"
          test -f "${lib}"
          ldd -r "${lib}" 2>&1 | tee "${RUNNER_TEMP}/fs-c08-native-loader.log"
          if grep -Eq 'not found|undefined symbol' "${RUNNER_TEMP}/fs-c08-native-loader.log"; then
            echo 'FS-C08: unresolved native runtime shared-library dependency' >&2
            exit 1
          fi
          # Real ELF dlopen of the library; not a synthetic transport test.
          python3 - "${lib}" <<'PY'
          import ctypes
          import sys
          ctypes.CDLL(sys.argv[1], mode=ctypes.RTLD_GLOBAL)
          print('FS_C08_FOUNDATION14_USER_LIBRARY_DLOPEN_PASS__NO_CFD_RUN')
          PY
      - name: Retain REAL native compiler diagnostics on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-c08-native-openfoam14-wmake-log
          path: ${{ runner.temp }}/fs-c08-native-wmake.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish machine-readable Foundation14 compiler status on commit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.native-build.outcome }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/fs-c08-native-wmake.log"
          case "${BUILD_OUTCOME:-skipped}" in
            success) state=success; summary="Real OpenFOAM14 wmake libso PASS; no physical CFD run" ;;
            *) state=failure
               summary="Native OpenFOAM14 build did not pass"
               if test -f "${log}"; then
                 first_error=$(grep -m 1 -E 'fatal error:|error:|undefined reference|make: \*\*\*' "${log}" || true)
                 if test -n "${first_error}"; then summary="${first_error}"; fi
               fi ;;
          esac
          summary="${summary:0:135}"
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="fs-c08/foundation14-wmake" \
            -f description="${summary}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
