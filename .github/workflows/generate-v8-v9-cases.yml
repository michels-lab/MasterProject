name: Generate V8 V9 controlled cases

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis_tools/create_v8_v9_cases.py'
      - 'analysis_tools/v8_v9_trigger.txt'
      - '.github/workflows/generate-v8-v9-cases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Generate cases
        run: python3 analysis_tools/create_v8_v9_cases.py

      - name: Commit generated cases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases_controlled_buoyancy/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "cases: add V8 adaptive outer4 and V9 top fixed-flux tests"
            git push origin HEAD:${{ github.head_ref }}
          fi
