name: Physics diagnostics analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis_tools/physics_diagnostics_analysis.py'
      - 'analysis_tools/coupling_analysis.py'
      - 'analysis_tools/physics_diagnostics_trigger.txt'
      - '.github/workflows/physics-diagnostics-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run physics diagnostics analysis
        run: python3 analysis_tools/physics_diagnostics_analysis.py

      - name: Run coupling analysis
        run: python3 analysis_tools/coupling_analysis.py

      - name: Print summaries
        run: |
          echo "===== PHYSICS DIAGNOSTICS ====="
          cat analysis_results/physics_diagnostics/physics_diagnostics_summary.md
          echo "===== COUPLING DIAGNOSTICS ====="
          cat analysis_results/coupling/coupling_summary.md
