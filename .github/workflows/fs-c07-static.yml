name: FS-C07 native thermal transition staging (synthetic only, NO CFD)

on:
  push:
    branches:
      - research/fs-c02-metal-air-vof-20261117
    paths:
      - 'analysis_tools/stage_fs_c07_native.py'
      - 'analysis_tools/test_stage_fs_c07_native.py'
      - 'freesurface/FS-C07_thermal_transition/**'
      - '.github/workflows/fs-c07-static.yml'
  pull_request:
    paths:
      - 'analysis_tools/stage_fs_c07_native.py'
      - 'analysis_tools/test_stage_fs_c07_native.py'
      - 'freesurface/FS-C07_thermal_transition/**'
      - '.github/workflows/fs-c07-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs-c07-source-and-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python native stager syntax (does not run foamMultiRun)
        run: |
          python3 -m py_compile analysis_tools/stage_fs_c07_native.py analysis_tools/test_stage_fs_c07_native.py
      - name: FS-C07 source preflight, native input and source isolation regressions
        run: |
          python3 -m unittest discover -s analysis_tools -p 'test_stage_fs_c07_native.py' -v
