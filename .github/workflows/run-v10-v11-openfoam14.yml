name: TEMP Run C11 energy2 OpenFOAM 14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-v10-v11-openfoam14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-case:
    name: C11_energy2_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenFOAM 14
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget -qO- https://dl.openfoam.org/gpg.key | sudo tee /etc/apt/trusted.gpg.d/openfoam.asc >/dev/null
          sudo rm -f /etc/apt/sources.list.d/*dl_openfoam_org*list
          sudo add-apt-repository -y "http://dl.openfoam.org/ubuntu main dev"
          sudo apt-get update
          sudo apt-get install -y openfoam14

      - name: Run case
        shell: bash
        env:
          CASE_NAME: C11_energy2_test
        run: |
          source /opt/openfoam14/etc/bashrc
          set -euo pipefail
          cd "cases_controlled_buoyancy/$CASE_NAME"
          ./Allclean || true
          ./Allrun
          echo "Latest time:"
          foamListTimes -latestTime
          tar -czf "$GITHUB_WORKSPACE/${CASE_NAME}-results.tar.gz" \
            log.foamMultiRun log.blockMesh log.splitMeshRegions log.foamPostProcess log.foamLog \
            logs postProcessing 2>/dev/null || true
          test "$(foamListTimes -latestTime)" = "10"
          tail -n 10 log.foamMultiRun | grep -q "End"

      - name: Commit real energy2 results to main
        if: success()
        shell: bash
        env:
          CASE_NAME: C11_energy2_test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "cases_controlled_buoyancy/$CASE_NAME"
          if git diff --cached --quiet
          then
            echo "No result changes to commit."
          else
            git commit -m "results: store C11 energy2 test"
            git push origin HEAD:main
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C11_energy2_test-results
          if-no-files-found: warn
          retention-days: 14
          path: C11_energy2_test-results.tar.gz
