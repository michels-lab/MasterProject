name: Uy temporal analysis

on:
  push:
    branches: [main]
    paths:
      - 'analysis_tools/uy_temporal_analysis.py'
      - '.github/workflows/uy-temporal-analysis.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'analysis_tools/uy_temporal_analysis.py'
      - 'analysis_tools/uy_temporal_trigger.txt'
      - '.github/workflows/uy-temporal-analysis.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run exhaustive Uy analysis
        run: python3 analysis_tools/uy_temporal_analysis.py

      - name: Commit generated analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_results/uy_temporal/
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "results: add exhaustive temporal Uy analysis [skip ci]"
            git push
          fi
