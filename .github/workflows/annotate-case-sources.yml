name: Annotate case source files

on:
  push:
    branches:
      - docs/case-code-comments-20261002
    paths:
      - analysis_tools/annotate_case_sources.py
      - .github/workflows/annotate-case-sources.yml

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/case-code-comments-20261002
          fetch-depth: 0

      - name: Append explanatory comments
        run: python3 analysis_tools/annotate_case_sources.py

      - name: Validate whitespace and syntax-neutral change shape
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          out = subprocess.check_output(["git", "diff", "--numstat"], text=True)
          bad = []
          for line in out.splitlines():
              add, delete, path = line.split("\t", 2)
              if delete != "0":
                  bad.append((path, add, delete))
          if bad:
              raise SystemExit(f"Unexpected deletions detected: {bad[:10]}")
          print("Validation OK: annotation pass added lines only.")
          PY

      - name: Commit annotated case files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases_controlled_buoyancy cases_buoyancy cleanproy
          if git diff --cached --quiet; then
            echo "No case source files required annotation."
            exit 0
          fi
          git commit -m "docs: append explanatory comments to all case source files"
          git push origin HEAD:docs/case-code-comments-20261002
