name: Case A C3D-04 - original C14 fluid + mold + phase-change native F14

on:
  push:
    paths:
      - "cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/**"
      - ".github/workflows/c3d04-a-c14-native-fluid-solid.yml"
  pull_request:
    paths:
      - "cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/**"
      - ".github/workflows/c3d04-a-c14-native-fluid-solid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3d04-a-c14-native-physical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c14-fluid-solid-phase-source:
    name: F14 C14 original fluid/solid phase-change actual 3D synthetic solver (NOT V4/T02)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Original C14 source and 3D mesh mapping positive and negative regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests \
            -p 'test_stage_c14_fluid_solid.py' -v
      - name: Fail fast on Python syntax before installing native Foundation14
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics")
          for path in sorted(root.glob("*.py")):
              compile(path.read_bytes(), str(path), "exec")
              print("SOURCE_SYNTAX_PASS", path)
          PY
      - name: Install real OpenFOAM Foundation 14
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 14
      - name: Execute two steps of ORIGINAL C14 metal=fluid + mold=solid on disposable 3D mesh
        run: |
          set -euo pipefail
          python3 -B cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/native_c14_fluid_solid_smoke.py \
            --out "$RUNNER_TEMP/C3D04_A_C14_ORIGINAL_FLUID_SOLID_SYNTHETIC"
      - name: ZIP logs including original colon-bearing phaseChangeSource fields (even on failure)
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          target = Path(os.environ["RUNNER_TEMP"])
          base = target/"C3D04_A_C14_ORIGINAL_FLUID_SOLID_SYNTHETIC"
          archive = target/"C3D04_A_C14_ORIGINAL_FLUID_SOLID_SYNTHETIC_EVIDENCE.zip"
          if base.is_dir():
              with ZipFile(archive,"w",compression=ZIP_DEFLATED) as z:
                  for f in sorted(base.rglob("*")):
                      if f.is_file():
                          z.write(f,f.relative_to(base))
              print("Preserved native F14 evidence:",archive)
          else:
              print("No native run directory exists; earlier step blocked.")
          PY
      - name: Preserve entire native output as single ZIP, including colon field names
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3d04-a-original-c14-3d-fluid-solid-native-logs
          path: ${{ runner.temp }}/C3D04_A_C14_ORIGINAL_FLUID_SOLID_SYNTHETIC_EVIDENCE.zip
          if-no-files-found: warn
          retention-days: 30
