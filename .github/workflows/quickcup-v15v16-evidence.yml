name: QuickCup V15-V16 evidence (no CFD)

on:
  pull_request:
    paths:
      - 'analysis_tools/granada_v15v16_postrun.py'
      - 'analysis_tools/test_granada_v15v16_postrun.py'
      - 'docs/granada/V15_V16_SOURCE_EVIDENCE_20261020.md'
      - '.github/workflows/quickcup-v15v16-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postrun-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python availability
        run: python3 --version
      - name: Synthetic numerical/provenance regressions
        run: python3 -m unittest discover -s analysis_tools -p test_granada_v15v16_postrun.py -v
      - name: Read-only analysis of committed QuickCup outputs
        run: |
          mkdir -p "/tmp/quickcup-granada"
          python3 analysis_tools/granada_v15v16_postrun.py \
            --root "$GITHUB_WORKSPACE" \
            --out "/tmp/quickcup-granada/evidence"
      - name: Require attributable source evidence and report measured warnings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/quickcup-granada/evidence/evidence.json').read_text())
          assert len(d['cases'])==6 and len(d['comparisons'])==4
          for case in d['cases']:
              assert all(case['source_files'][name] for name in ('probe_T','courant','continuity')), case['case']
              print(case['case'], 'Courant max=', case.get('courant_max_observed'),
                    'exceedances=', case.get('courant_over_limit_count'),
                    'cumulative continuity=', case.get('continuity_cumulative_last'),
                    'alerts=', case['alerts'])
          for pair in d['comparisons']:
              assert pair['metrics'] and pair['metrics']['aligned_samples']>1, pair['variant']
              print(pair['parent'],'->',pair['variant'], 'T-RMSE(K)=',
                    pair['metrics']['rmse_K'], 'max abs delta(K)=',
                    pair['metrics']['max_abs_delta_K'])
          print('Source-backed data presence and 4 comparisons confirmed; physical validation NOT established.')
          PY
      - name: Preserve candidate evidence (not CFD verification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcup-v15v16-evidence
          path: /tmp/quickcup-granada/evidence/
          if-no-files-found: warn
          retention-days: 14
