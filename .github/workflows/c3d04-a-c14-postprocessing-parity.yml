name: C3D04 A Original C14 3D Postprocessing Volume Parity

on:
  push:
    paths:
      - "cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/**"
      - ".github/workflows/c3d04-a-c14-postprocessing-parity.yml"
  pull_request:
    paths:
      - "cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/**"
      - ".github/workflows/c3d04-a-c14-postprocessing-parity.yml"
  workflow_dispatch:

jobs:
  static-and-synthetic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile read-only 3D C14 parity analyzer and regressions
        run: |
          python -m py_compile \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/c14_3d_postprocess_parity.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/run_c14_3d_complete_postprocess.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/c14_3d_native_energy_closure.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/recover_existing_c14_3d_stage07.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/audit_existing_native_c14_stage07.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/run_c14_stage07_solver_backed_recovery.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/audit_c14_stage07_active_cellzone.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests/test_c14_3d_postprocess_parity.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests/test_native_complete_postprocess.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests/test_c14_3d_native_energy_closure.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests/test_c14_3d_stage07_recovery.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests/test_c14_3d_native_stage07_forensics.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests/test_c14_stage07_solver_backed_recovery.py \
            cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests/test_c14_stage07_active_zone_audit.py
      - name: Synthetic native-polyMesh and C14 diagnostic fidelity tests
        run: |
          python -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests \
            -p 'test_*postprocess*.py' -v
          python -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests \
            -p 'test_c14_3d_native_energy_closure.py' -v
      - name: Stage07 read-only recovery, 101-state kinetics and native-copy provenance
        run: |
          python -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests \
            -p 'test_c14_3d_stage07_recovery.py' -v
      - name: C14 native stage07 failed command, missing field and energy SHA forensic regression
        run: |
          python -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests \
            -p 'test_c14_3d_native_stage07_forensics.py' -v
      - name: Prohibit solver/process launching in standalone native forensics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path("cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/audit_existing_native_c14_stage07.py")
          tree=ast.parse(path.read_text(encoding="utf-8"))
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  assert not any(x.name in ("subprocess","shutil") for x in node.names)
              if isinstance(node,ast.ImportFrom):
                  assert node.module not in ("subprocess","shutil")
          print("Native-stage07 forensics never launches CFD, native postprocessing or bulk copy.")
          PY
      - name: C14 Foundation14 solver-backed offline separated groups and real patch-power tables
        run: |
          python -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests \
            -p 'test_c14_stage07_solver_backed_recovery.py' -v
      - name: Existing _03 actual mesh zone/time-instance read-only root cause audit tests
        run: |
          python -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/tests \
            -p 'test_c14_stage07_active_zone_audit.py' -v
      - name: Ensure _03 evidence audit cannot launch subprocesses or mutate prior CFD
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/audit_c14_stage07_active_cellzone.py")
          tree=ast.parse(p.read_text(encoding="utf-8"))
          for n in ast.walk(tree):
              if isinstance(n,ast.Import):
                  assert not any(a.name in ("subprocess","shutil","os") for a in n.names)
              if isinstance(n,ast.ImportFrom):
                  assert n.module not in ("subprocess","shutil","os")
              if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute):
                  assert n.func.attr not in ("write_text","write_bytes","mkdir","unlink","rename","rmtree","copytree","run","Popen")
          print("Case A zone time-instance audit: no writes, mesh mutations or solver launches.")
          PY
      - name: Fail if native recovery invokes CFD, mesh or destructive Git actions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path("cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/run_c14_stage07_solver_backed_recovery.py")
          tree=ast.parse(src.read_text(encoding="utf-8"))
          allowed={"foamPostProcess"}
          calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and
                 isinstance(n.func,ast.Name) and n.func.id=="old"]
          assert not calls
          txt=src.read_text(encoding="utf-8")
          assert "old.run_native(copy,\"solverBacked_\"+group,args)" in txt
          assert '["foamPostProcess","-region","metal","-solver","fluid"' in txt
          assert "subprocess.run(" not in txt
          print("Offline groups: only foamPostProcess on new isolated A copy, no CFD solver.")
          PY
      - name: Ensure recovery script has no solver/subprocess or destructive input writes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          file=Path("cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/recover_existing_c14_3d_stage07.py")
          tree=ast.parse(file.read_text(encoding="utf-8"))
          for x in ast.walk(tree):
              if isinstance(x,ast.Import):
                  assert all(i.name not in ("subprocess","shutil") for i in x.names)
              if isinstance(x,ast.ImportFrom):
                  assert x.module not in ("subprocess","shutil")
          print("Recovery script cannot launch solver or clone/delete native CFD artifacts.")
          PY
      - name: Fail if postprocessing script launches a CFD solver
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path("cases_3d/C3D_04_rounded_multiblock_pilot/c14_physics/c14_3d_postprocess_parity.py")
          tree=ast.parse(path.read_text(encoding="utf-8"))
          forbidden={"subprocess","os.system","os.popen"}
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  assert not any(x.name.startswith("subprocess") for x in node.names)
              if isinstance(node,ast.ImportFrom):
                  assert node.module!="subprocess"
          print("Postprocessing only: no subprocess module, original 10s CFD is not re-executed.")
          PY
