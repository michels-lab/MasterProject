name: V9 flow causality analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis_tools/v9_flow_causality_analysis.py'
      - 'analysis_tools/v9_flow_causality_trigger.txt'
      - '.github/workflows/v9-flow-causality.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze V9 flow reversals
        run: python3 analysis_tools/v9_flow_causality_analysis.py
