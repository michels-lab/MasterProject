name: Campaign transfer snapshot checks
on:
  push:
    branches: [main]
    paths:
      - tools/transfer_campaign_200s.py
      - tools/test_transfer_campaign_200s.py
      - .github/workflows/transfer-campaign-200s-static.yml
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: python3 -B tools/test_transfer_campaign_200s.py -v
