name: Case A C3D-04 integrated stage contract (static only)

on:
  push:
    paths:
      - "AGENTS.md"
      - "cases_3d/C3D_04_rounded_multiblock_pilot/**"
      - "docs/C3D04_CASE_A_STATUS.json"
      - ".github/workflows/case-a-t0-stage-contract.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "cases_3d/C3D_04_rounded_multiblock_pilot/**"
      - "docs/C3D04_CASE_A_STATUS.json"
      - ".github/workflows/case-a-t0-stage-contract.yml"

permissions:
  contents: read

jobs:
  case-a-integrated-t0-pre-cfd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Canonical phase and completion fraction
        run: python3 cases_3d/C3D_04_rounded_multiblock_pilot/scripts/report_case_a_progress.py
      - name: Positive and negative integrated Case A T0 static regression
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s cases_3d/C3D_04_rounded_multiblock_pilot/t0_conduction/tests \
            -p 'test_integrated_case_a.py' -v
      - name: Bash syntax of single-stage runner
        run: bash -n cases_3d/C3D_04_rounded_multiblock_pilot/t0_conduction/run_integrated_milestone.sh
      - name: Scientific status boundary
        run: |
          python3 - <<'PY'
          import json, pathlib
          status=json.loads(pathlib.Path("docs/C3D04_CASE_A_STATUS.json").read_text())
          assert all(type(status[key]) is bool for key in
                     ("CFD_run","physical_validation","grid_independence"))
          if status["CFD_run"]:
              executed = next(x for x in status["milestones"]
                              if x["id"] == "07_THERMAL_T0_EXECUTION")
              assert executed["status"] == "DONE"
              assert executed["evidence"] and pathlib.Path(executed["evidence"]).is_file()
          data=json.loads(pathlib.Path("cases_3d/C3D_04_rounded_multiblock_pilot/t0_conduction/T0_INPUTS.json").read_text())
          mapping={"rho_kg_m3":"source_rho","Cv_J_kg_K":"source_Cv",
                   "kappa_W_m_K":"source_kappa","molWeight_g_mol":"source_molWeight",
                   "T_initial_K":"source_T_initial"}
          for region in ("metal","mold"):
              for key, provenance_key in mapping.items():
                  value=data[region].get(key)
                  if value is not None:
                      assert type(value) in (int,float) and value>0, (region,key)
                      citation=data[region].get(provenance_key)
                      assert isinstance(citation,str) and len(citation.strip())>=10, (region,provenance_key)
          # The Foundation14 official multi-region heatedDuct tutorial has
          # both system/fvSolution (global PIMPLE) and regional fvSolution.
          from pathlib import Path
          generator=Path("cases_3d/C3D_04_rounded_multiblock_pilot/t0_conduction/scripts/prepare_case_a_t0.py").read_text()
          assert '"system/fvSolution": global_solution(' in generator
          assert "nEnergyCorrectors" in generator
          assert "tempfile.TemporaryDirectory" in generator
          print("PASS: dynamic science-status boundary, global Foundation14 PIMPLE, atomic T0 and citations")
          PY
